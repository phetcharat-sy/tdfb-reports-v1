<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TDFB Operations Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root {
  --font-sans: 'IBM Plex Sans Thai', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  
  --primary: #0d9488;
  --primary-hover: #0f766e;
  --primary-light: #f0fdf4;
  --indigo: #6366f1;
  --indigo-dark: #4f46e5;
  --amber: #f59e0b;
  --rose: #ef4444;
  --good: #10b981;
  --good-bg: #ecfdf5;
  --bad: #ef4444;
  --bad-bg: #fef2f2;
  
  --bg-page: #f8fafc;
  --bg-card: #ffffff;
  --bg-soft: #f1f5f9;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  
  --ink: #0f172a;
  --mute: #64748b;
  --faint: #94a3b8;
  
  --sidebar-bg: #0f172a;
  --sidebar-text: #94a3b8;
  --sidebar-hover: #1e293b;

  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.03);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  color: var(--ink);
  background: var(--bg-page);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.shell { display: flex; min-height: 100vh; }

/* ---------- Sidebar ---------- */
.side {
  width: 280px;
  flex: none;
  color: #f8fafc;
  background: var(--sidebar-bg);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  border-right: 1px solid rgba(255,255,255,0.06);
  z-index: 50;
}

.side .brand {
  padding: 24px 20px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.side .brand b {
  display: block;
  font-family: 'Plus Jakarta Sans', var(--font-sans);
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: #ffffff;
}
.side .brand span {
  font-size: 11px;
  color: var(--primary);
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

.sidenav { padding: 16px 12px; flex: 1; }
.sidenav .grp {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #64748b;
  padding: 18px 12px 6px;
  font-family: var(--font-mono);
}
.sidenav button {
  display: flex;
  align-items: center;
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  color: var(--sidebar-text);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s ease;
  margin-bottom: 2px;
}
.sidenav button:hover {
  background: var(--sidebar-hover);
  color: #ffffff;
}
.sidenav button.on {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
  color: #ffffff;
  font-weight: 600;
  box-shadow: 0 4px 12px rgba(13, 148, 136, 0.3);
}

.side-foot {
  padding: 16px 20px;
  font-size: 12px;
  color: #64748b;
  border-top: 1px solid rgba(255,255,255,0.08);
}

.main { flex: 1; min-width: 0; }

/* ---------- KPI View Container ---------- */
#vKPI .wrap {
  max-width: 1600px;
  margin: 0 auto;
  padding: 32px;
}

/* Toolbar */
#vKPI .toolbar {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px 20px;
  display: flex;
  gap: 12px;
  align-items: flex-end;
  flex-wrap: wrap;
  box-shadow: var(--shadow-sm);
  margin-bottom: 24px;
}

#vKPI .kf { display: flex; flex-direction: column; gap: 4px; }
#vKPI .kf > label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--mute);
  font-family: var(--font-mono);
}

#vKPI select, #vKPI .btn, #vKPI #kDayBtn, #vKPI #kWBtn {
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 14px;
  font-size: 14px;
  font-family: inherit;
  background: #ffffff;
  color: var(--ink);
  transition: all 0.15s ease;
  height: 38px;
}
#vKPI select:hover, #vKPI .btn:hover { border-color: var(--border-strong); }
#vKPI .btn {
  background: var(--primary);
  color: #ffffff;
  border: 0;
  font-weight: 600;
  cursor: pointer;
}
#vKPI .btn:hover { background: var(--primary-hover); }
#vKPI .btn.ghost {
  background: #ffffff;
  color: var(--ink);
  border: 1px solid var(--border);
}
#vKPI .btn.ghost:hover { background: var(--bg-soft); }

#vKPI .stat {
  color: var(--mute);
  font-size: 13px;
  margin-left: auto;
  align-self: center;
}
#vKPI .stat b { color: var(--primary); }

/* Header Banner */
#vKPI header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  border-bottom: 2px solid var(--border);
  padding-bottom: 16px;
  margin-bottom: 24px;
}
#vKPI h1 {
  margin: 0;
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--ink);
}
#vKPI .sub { color: var(--mute); font-size: 14px; margin-top: 2px; }
#vKPI .period { text-align: right; color: var(--mute); font-size: 13px; }
#vKPI .period b { display: block; color: var(--ink); font-size: 18px; font-weight: 700; }

/* Section Titles */
#vKPI h2.sec {
  font-size: 20px;
  font-weight: 700;
  margin: 32px 0 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
#vKPI h2.sec span { flex: 1; height: 1px; background: var(--border); }

/* KPI Grid */
#vKPI .kpis { display: flex; flex-direction: column; gap: 12px; }
#vKPI .kpi {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px 20px;
  box-shadow: var(--shadow-sm);
  display: grid;
  grid-template-columns: 280px 140px 1fr;
  align-items: center;
  gap: 16px;
  position: relative;
  overflow: hidden;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
#vKPI .kpi:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}
#vKPI .kpi::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
  background: var(--faint);
}
#vKPI .kpi.pass::before { background: var(--good); }
#vKPI .kpi.fail::before { background: var(--bad); }

#vKPI .kpi .l { font-size: 16px; font-weight: 700; color: var(--ink); }
#vKPI .kpi .t { font-size: 13px; color: var(--mute); }
#vKPI .kpi .v {
  font-size: 32px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.5px;
}
#vKPI .badge {
  font-size: 12px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 20px;
  display: inline-block;
  width: fit-content;
}
#vKPI .badge.pass { background: var(--good-bg); color: var(--good); }
#vKPI .badge.fail { background: var(--bad-bg); color: var(--bad); }
#vKPI .badge.wait { background: var(--bg-soft); color: var(--mute); }

/* Tables */
#vKPI table.dt {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 14px;
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
#vKPI table.dt th {
  background: var(--bg-soft);
  text-align: left;
  color: var(--mute);
  font-weight: 600;
  font-size: 13px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
#vKPI table.dt td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
#vKPI table.dt tr:last-child td { border-bottom: 0; }
#vKPI table.dt tr:hover td { background: #f8fafc; }

/* Responsive Mobile Toggle */
.side-toggle {
  display: none;
  position: fixed;
  top: 12px; left: 12px; z-index: 80;
  background: var(--sidebar-bg);
  color: #fff;
  border: 0;
  border-radius: var(--radius-sm);
  width: 40px; height: 40px;
  font-size: 20px;
  cursor: pointer;
}

@media(max-width: 1024px) {
  .side {
    position: fixed; left: 0; top: 0;
    transform: translateX(-100%);
    transition: transform 0.2s ease;
  }
  body.side-open .side { transform: none; }
  .side-toggle { display: block; }
  #vKPI .wrap { padding: 20px 16px; }
  #vKPI .kpi { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<button class="side-toggle" id="sideToggle" aria-label="เปิด/ปิดเมนู">☰</button>
<div class="shell">
  <aside class="side" id="side">
    <div class="brand">
      <b>TDFB</b>
      <span>Operations Dashboard</span>
    </div>
    <nav class="sidenav">
      <div class="grp">ภาพรวม</div>
      <button data-view="kpi" data-sec="overview" class="on">KPI ทุกแผนก</button>

      <div class="grp">Warehouse</div>
      <button data-view="kpi" data-sec="ontime">KPI On-Time Performance</button>
      <button data-view="kpi" data-sec="oos">KPI Out Of Stock</button>
      <button data-view="kpi" data-sec="diff">KPI Stock Variance &lt;2%</button>
      <button data-view="kpi" data-sec="dock">KPI Dock Time To Stock</button>
      <button data-view="kpi" data-sec="pick">Picking</button>
      <button data-view="kpi" data-sec="perr">KPI Human Error On Picking &lt;0.05%</button>
      <button data-view="kpi" data-sec="repl">Replenishment</button>

      <div class="grp">Delivery</div>
      <button data-view="kpi" data-sec="pack">Packing</button>

      <div class="grp">Admin</div>
      <button data-view="kpi" data-sec="ship">การจัดส่ง (Shipping)</button>

      <div class="grp">วิธีการปฏิบัติงาน</div>
      <button data-view="kpi" data-sec="sop">เงื่อนไขการส่งสินค้าแต่ละ Platform</button>

      <div style="height: 12px;"></div>
      <button data-view="kpi" data-sec="fc">Forecast</button>
    </nav>
    <div class="side-foot">ข้อมูลสดจาก Google Sheets</div>
  </aside>

  <main class="main">
    <div id="vKPI">
      <div class="wrap">
        <div class="toolbar">
          <div class="kf">
            <label>YEAR</label>
            <select id="kY" autocomplete="off"><option value="">All</option></select>
          </div>
          <div class="kf">
            <label>MONTH</label>
            <select id="kM" autocomplete="off"><option value="">All</option></select>
          </div>
          <div class="kf">
            <label>WEEK</label>
            <button class="btn ghost" id="kWBtn">All</button>
          </div>
          <div class="kf">
            <label>DAY</label>
            <button class="btn ghost" id="kDayBtn">All</button>
          </div>
          <button class="btn ghost" id="kClear">Clear filters</button>
          <button class="btn ghost" id="kReload">ดึงข้อมูลใหม่</button>
          <button class="btn" id="kSave">บันทึกเป็นรูป</button>
          <button class="btn ghost" id="kPresent">🖥 โหมดพรีเซนต์</button>
          <div class="stat" id="kStat">กำลังเตรียมข้อมูล…</div>
        </div>

        <div id="kShot">
          <header>
            <div>
              <h1 id="kTitle">ภาพรวม KPI ทุกแผนก</h1>
              <div class="sub" id="kSub">Warehouse · Delivery · Admin — TDFB</div>
            </div>
            <div class="period">
              ข้อมูลของวันที่<b id="kPeriod">—</b>
              <span class="kchip" id="kChip" style="display:none"></span>
            </div>
          </header>

          <div id="ovBox">
            <div class="top" id="top"></div>
            <h2 class="sec">Warehouse <em id="whNote"></em><span></span></h2>
            <div class="kpis" id="wh"></div>

            <h2 class="sec">Delivery<span></span></h2>
            <div class="kpis" id="dl"></div>

            <h2 class="sec">Admin<span></span></h2>
            <div class="kpis" id="ad"></div>
          </div>

          <div id="detail" hidden></div>
          <div class="foot" style="margin-top:24px; color:var(--mute); font-size:12px; display:flex; justify-content:space-between;">
            <span id="src"></span>
            <span id="kTs">—</span>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
// Sidebar Toggle functionality
const sideToggle = document.getElementById('sideToggle');
if(sideToggle) {
  sideToggle.addEventListener('click', () => {
    document.body.classList.toggle('side-open');
  });
}
</script>
</body>
</html>
